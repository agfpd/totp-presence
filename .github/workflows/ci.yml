name: ci

# Runs on every push and pull request against main. Parallel jobs:
#   - shellcheck on all .sh files (static analysis)
#   - bats hook tests on ubuntu-latest (no sudo, sandbox via sed rewrite)
#   - bats hook tests on macos-latest  (same, validates bash 3.2 + BSD date)
#   - bats core lifecycle tests on ubuntu-latest (live install, unattended)
#
# Core lifecycle tests are destructive and need a real /etc/totp-presence
# seed. In CI we use the --unattended install path (gated behind
# TOTP_PRESENCE_UNATTENDED_OK=1 — see core/setup.sh) with a fixed test
# seed, then exercise verify.sh via the tests/core/verify_lifecycle.bats
# suite. macOS coverage for the lifecycle suite is deferred until the
# ubuntu job has been green for a few releases — macOS runner minutes
# are 10× more expensive and the lifecycle code path is OS-agnostic.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on all .sh files
        # --severity=warning: info-level hints (SC2015 on A && B || C,
        # SC2012 ls-vs-find, SC2181 $? style) are acknowledged but not
        # CI-blocking — they are suggestions, not bugs. Anything at
        # warning or error level fails the job.
        # --exclude=SC1091: cannot follow sourced paths from the CI
        # root; irrelevant today (we don't source any files) but a
        # forward-looking exclusion if we add shared lib helpers.
        run: |
          set -e
          find . -type f -name '*.sh' -not -path './.git/*' -not -path './tests/*' -print0 \
            | xargs -0 shellcheck --shell=bash --severity=warning --exclude=SC1091

  hook-tests-ubuntu:
    name: bats hook tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Report environment
        run: |
          bats --version
          bash --version | head -1
          python3 --version

      - name: Run hook bats suite
        # tests/hook/ is sandboxed via sed path-rewrite; no sudo, no
        # /etc/totp-presence, no /var/run/totp-presence on disk.
        run: bats tests/hook/

  core-lifecycle-ubuntu:
    name: bats core lifecycle (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Report environment
        run: |
          bats --version
          bash --version | head -1
          python3 --version

      - name: Unattended core install with fixed test seed
        # --unattended skips the overwrite prompt, the otpauth URL (would
        # leak the seed into CI logs), the QR, and the 3-attempt self-test.
        # TOTP_PRESENCE_UNATTENDED_OK=1 is the second gate required to
        # reach that path (see cmd_install in core/setup.sh). The test
        # seed is fixed to a known base32 value so the bats suite's TOTP
        # helper and the installed verifier agree on codes.
        #
        # Env is passed on the command line (not via `sudo -E`) because
        # the default `env_reset` in sudoers on stock ubuntu would strip
        # arbitrary vars; `sudo VAR=value ...` is always honoured.
        run: |
          sudo \
            TOTP_PRESENCE_UNATTENDED_OK=1 \
            TOTP_PRESENCE_TEST_SEED=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP \
            SUDO_USER="$USER" \
            ./core/setup.sh install --unattended
          ./core/setup.sh status

      - name: Run core lifecycle + path-validation tests
        # TOTP_PRESENCE_RUN_LIFECYCLE=1 opts the destructive lifecycle
        # tests in. Without it, all 11 tests skip (verified locally).
        # Also runs the path-validation suite that was previously
        # release-gated only.
        env:
          TOTP_PRESENCE_RUN_LIFECYCLE: '1'
        run: bats tests/core/

  hook-tests-macos:
    name: bats hook tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: brew install bats-core

      - name: Report environment
        # macOS default /bin/bash is 3.2.57 — that's the floor we
        # document in README Requirements. python3 comes with the
        # Xcode Command Line Tools preinstalled on GitHub runners.
        run: |
          bats --version
          /bin/bash --version | head -1
          python3 --version

      - name: Run hook bats suite
        run: bats tests/hook/
